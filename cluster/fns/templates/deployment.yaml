{{- if .Values.enabled }}
{{- $hostname := required "Set hostname to the Service's public IPv4 address or your DNS name" .Values.hostname }}
{{- if and .Values.publicAccess (or .Values.registrationEnabled (not .Values.adminUid)) }}
{{- fail "Disable registration and set adminUid before enabling publicAccess" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fns
  template:
    metadata:
      labels:
        app: fns
        public-access: {{ .Values.publicAccess | quote }}
      annotations:
        configuration: {{ .Values | toJson | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: arm64
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: configure
          image: {{ .Values.image }}
          command: [sh, -ec]
          args:
            - |
              umask 077
              mkdir -p /data/config /data/storage
              if [ ! -f /data/config/auth-key ]; then
                head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /data/config/auth-key
              fi
              if [ ! -f /data/config/share-key ]; then
                head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /data/config/share-key
              fi
              cat > /data/config/config.yaml.new <<EOF
              server:
                http-port: ":9000"
                ext-api-url: "https://{{ $hostname }}"
              security:
                auth-token-key: "$(cat /data/config/auth-key)"
                share-token-key: "$(cat /data/config/share-key)"
              database:
                type: sqlite
                path: storage/database/db.sqlite3
              user:
                register-is-enable: {{ .Values.registrationEnabled }}
                admin-uid: {{ .Values.adminUid }}
              attachment-static:
                is-enable: false
              EOF
              mv /data/config/config.yaml.new /data/config/config.yaml
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: fns
          image: {{ .Values.image }}
          workingDir: /fast-note-sync
          command: [/fast-note-sync/fast-note-sync-service, run]
          ports:
            - name: app
              containerPort: 9000
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 2Gi}
          startupProbe:
            tcpSocket: {port: app}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket: {port: app}
          volumeMounts:
            - {name: data, mountPath: /fast-note-sync/storage, subPath: storage}
            - {name: data, mountPath: /fast-note-sync/config, subPath: config}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: fns-data}
{{- end }}
