apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bootstrap
  namespace: {{ .Release.Namespace }}
spec:
  sourceRepos:
    - https://github.com/viktorashi/personal-gitops-env.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fns
  namespace: {{ .Release.Namespace }}
spec:
  sourceRepos:
    - https://github.com/viktorashi/personal-gitops-env.git
  destinations:
    - namespace: fns
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: ServiceAccount
    - group: apps
      kind: Deployment
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: {{ .Release.Namespace }}
spec:
  project: bootstrap
  source:
    repoURL: https://github.com/viktorashi/personal-gitops-env.git
    targetRevision: main
    path: cluster/argocd
    helm:
      releaseName: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fns
  namespace: {{ .Release.Namespace }}
spec:
  project: fns
  source:
    repoURL: https://github.com/viktorashi/personal-gitops-env.git
    targetRevision: main
    path: cluster/fns
  destination:
    server: https://kubernetes.default.svc
    namespace: fns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
