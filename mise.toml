min_version = "2026.8.12"

# Shared repository checks: local hooks and CI.
[tools]
opentofu = "1.12.6"
python = "3.12.13"
prek = "0.4.14"
taplo = "0.10.0"
shfmt = "3.13.1"
shellcheck = "0.11.0"
rumdl = "0.2.60"
yamlfmt = "0.21.0"
actionlint = "1.7.12"
tflint = "0.64.0"
"go:github.com/hashicorp/hcl/v2/cmd/hclfmt" = { version = "2.25.0", depends = ["go"] }
go = "1.27.0"                                                                          # Build-time dependency of hclfmt.
uv = "0.12.5"
kubectl = "1.37.1"

[settings]
experimental = true

[env]
_.source = { path = "scripts/oci-env.sh", tools = true }
UV_LOCKED = "1"
UV_PYTHON_DOWNLOADS = "never"
UV_PYTHON_PREFERENCE = "only-system"
SOURCE_DATE_EPOCH = "1767225600"

[deps.uv]
auto = true
run = "uv sync --locked --all-groups"

[tasks.check]
description = "Run the same repository checks as CI"
depends = ["test"]
run = "prek run --all-files"

[tasks.test]
description = "Check backup rotation"
run = "uv run --locked python -m unittest discover -s functions/backup"

[tasks.install-hooks]
description = "Install local Git hooks"
run = "prek install --prepare-hooks"

[tasks.bootstrap]
description = "Set up repository hooks"
depends = ["install-hooks"]

[tasks.package-backup]
description = "Build the Functions deployment archive"
run = "uv run --locked --group build python functions/backup/package.py"

[tasks.oci-login]
description = "Only for admin user interactive session, not CI or nuthin"
run = 'oci session authenticate --region eu-frankfurt-1 --profile-name "${TF_VAR_profile:-DEFAULT}" --config-location "${OCI_CONFIG_FILE:-$HOME/.oci/config}"'
