name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  # The interactive OCI CLI's installer does not support locked downloads.
  MISE_DISABLE_TOOLS: oci
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          version: '2026.8.12'
          install_args: --locked
      - name: Verify locked dependencies and reproducible archive
        run: |
          uv sync --locked --all-groups
          mise run package-backup
          sha256sum functions/backup/function.zip > "$RUNNER_TEMP/backup.sha256"
          mise run package-backup
          sha256sum --check "$RUNNER_TEMP/backup.sha256"
      - name: Run repository hooks
        run: mise run check
  preview:
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      apply: false
  plan:
    needs: [validate, preview]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful validation and cloud preview
        env:
          VALIDATION: ${{ needs.validate.result }}
          PREVIEW: ${{ needs.preview.result }}
        run: test "$VALIDATION" = success && test "$PREVIEW" = success
  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/platform.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      apply: true
